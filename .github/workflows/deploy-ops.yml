name: Deploy → ops.wiwo.me

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-ops
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_OPS }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST_OPS }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build & Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER_OPS }}@${{ secrets.SSH_HOST_OPS }} << 'DEPLOY'
              set -e
              cd /root/wiwo.ops-front

              # Pull últimos cambios
              git fetch origin develop
              git reset --hard origin/develop

              # Install + build incremental
              node common/scripts/install-run-rush.js install
              node common/scripts/install-run-rush.js build

              VERSION=$(git rev-parse --short HEAD)

              # Bundle front
              cd dev/prod
              node ../../common/scripts/install-run-rushx.js package
              cd ../../pods/front
              node ../../common/scripts/install-run-rushx.js package
              node ../../common/scripts/install-run-rushx.js bundle
              docker build -t wiwo/ops-front:${VERSION} -t wiwo/ops-front:latest .

              # Bundle account: el fork modifica el servicio de cuentas (acceso
              # solo con Google y filtro por dominio de correo), así que no
              # puede seguir corriendo la imagen upstream.
              cd ../../pods/account
              node ../../common/scripts/install-run-rushx.js bundle
              docker build -t wiwo/ops-account:${VERSION} -t wiwo/ops-account:latest .

              # Bundle transactor: el modelo del fork (roles de proyecto,
              # permisos de tarea, campos del cliente) y el recorte por
              # colaborador viven acá. `bundle` corre `get-model`, que es lo que
              # genera el model.json que el transactor aplica al arrancar. Sin
              # esta imagen el modelo no llega nunca al workspace.
              cd ../../pods/server
              node ../../common/scripts/install-run-rushx.js bundle
              docker build -t wiwo/ops-transactor:${VERSION} -t wiwo/ops-transactor:latest .

              # Bundle workspace: corre las migraciones de modelo sobre cada
              # workspace, así que tiene que ir a la par del transactor.
              cd ../../pods/workspace
              node ../../common/scripts/install-run-rushx.js bundle
              docker build -t wiwo/ops-workspace:${VERSION} -t wiwo/ops-workspace:latest .

              # Bundle migrador: contiene el centro de control y la lógica de
              # importación, por lo que debe recrearse con cada deploy.
              cd ../../dev/perfex-clients
              node ../../common/scripts/install-run-rushx.js bundle
              docker build -t wiwo/perfex-migration:${VERSION} -t wiwo/perfex-migration:latest .

              # Restart containers. compose.testops.yml está versionado en el
              # repo de configuración y fija las imágenes a `latest`;
              # `up -d` recrea el contenedor porque cambió el id de la imagen.
              # Todos van juntos: el front, las APIs y el migrador tienen que
              # hablar la misma versión.
              cd /root/huly-selfhost
              docker compose -f compose.yml -f compose.testops.yml up -d front account transactor workspace perfex-migration

              # nginx resuelve las IPs de los upstream al arrancar y las cachea:
              # tras recrear front y account apunta a IPs que ya no existen y
              # todo el sitio responde 502. Hay que reiniciarlo después, siempre.
              docker compose -f compose.yml -f compose.testops.yml restart nginx

              # Limpiar imágenes viejas
              docker image prune -f --filter "label=com.docker.compose.service=front" 2>/dev/null || true
              docker image prune -f --filter "label=com.docker.compose.service=account" 2>/dev/null || true
              docker image prune -f --filter "label=com.docker.compose.service=transactor" 2>/dev/null || true
              docker image prune -f --filter "label=com.docker.compose.service=workspace" 2>/dev/null || true
              docker image prune -f --filter "label=com.docker.compose.service=perfex-migration" 2>/dev/null || true

              echo "✅ Deployed front, account, transactor, workspace y perfex-migration: ${VERSION}"
          DEPLOY
